---
- name: Harden Ubuntu and MySQL for Project 2
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Remove conflicting PermitRootLogin yes lines from sshd_config
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*PermitRootLogin\s+yes\b'
        state: absent
      notify: Restart ssh

    - name: Enforce PermitRootLogin no and PasswordAuthentication no in sshd_config
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}\\s+"
        line: "{{ item.key }} {{ item.value }}"
        state: present
      loop:
        - { key: "PermitRootLogin", value: "no" }
        - { key: "PasswordAuthentication", value: "no" }
      notify: Restart ssh

    - name: Ensure course sshd drop-in does not re-enable root login
      file:
        path: /etc/ssh/sshd_config.d/99-course.conf
        state: absent
      failed_when: false
      notify: Restart ssh

    - name: Configure UFW default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: "incoming", policy: "deny" }
        - { direction: "outgoing", policy: "allow" }

    - name: Allow SSH in UFW
      ufw:
        rule: allow
        name: OpenSSH

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Remove suspicious cron job in /etc/cron.d
      file:
        path: /etc/cron.d/sysstat-collect
        state: absent
      failed_when: false

    - name: Stop and disable rogue nclistener service
      systemd:
        name: nclistener.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove rogue nclistener unit file if present
      file:
        path: /etc/systemd/system/nclistener.service
        state: absent
      failed_when: false

    - name: Reload systemd daemon after removing rogue service
      systemd:
        daemon_reload: true

    - name: Fix permissions on world-writable /srv/app/uploads directory
      file:
        path: /srv/app/uploads
        state: directory
        mode: "0755"
      failed_when: false

    - name: Remove helpdesk from sudo group
      user:
        name: helpdesk
        groups: ""
        append: false
      failed_when: false

   # - name: Remove NOPASSWD sudoers drop-in file
    #  file:
     #   path: /etc/sudoers.d/90-course-nopasswd
      #  state: absent
      #failed_when: false

    #- name: Remove NOPASSWD:ALL from cloud-init sudoers if present
     # replace:
     #   path: /etc/sudoers.d/90-cloud-init-users
     #   regexp: 'NOPASSWD:ALL'
     #   replace: 'ALL'
     #   validate: '/usr/sbin/visudo -cf %s'
     # failed_when: false

    - name: Restrict permissions on /opt/crm/.env credential file
      file:
        path: /opt/crm/.env
        owner: root
        group: root
        mode: "0600"
      failed_when: false

    - name: Ensure Fail2Ban is installed and configured for sshd
      apt:
        name: fail2ban
        state: present

    - name: Write sshd jail configuration for Fail2Ban
      copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          port = ssh
          backend = systemd
      notify: Restart fail2ban

    - name: Check if mysql client exists
      command: which mysql
      register: mysql_check
      changed_when: false
      failed_when: false

    - name: Harden MySQL accounts and privileges
      shell: |
        set -e
        mysql <<'SQL'
        DROP USER IF EXISTS 'root'@'%';
        DROP USER IF EXISTS ''@'localhost';

        REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'webapp'@'%';
        GRANT SELECT, INSERT, UPDATE, DELETE ON ticketdb.* TO 'webapp'@'%';

        REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'reporting'@'%';
        GRANT SELECT ON ticketdb.* TO 'reporting'@'%';

        FLUSH PRIVILEGES;
        SQL
      when: mysql_check.rc == 0

  handlers:
    - name: Restart ssh
      service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      service:
        name: fail2ban
        state: restarted
